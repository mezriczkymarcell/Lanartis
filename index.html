<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lanartis Group</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lanartis Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: Planet Budapest-féle csendes elegancia — meleg szürkésbézs alap, könnyű súlyú groteszk, sok levegő,
   középre zárt, görgetésre sötétedő kulcsmondat, nagy fotósávok enyhén lekerekítve; a területek csak finom árnyalattal különülnek el. */
:root{
  --bg:#ECE8E4; --paper:#F6F4F1; --ink:#4A463F; --ink-strong:#2E2B26; --muted:#8E887E; --faint:rgba(74,70,63,.22); --line:rgba(74,70,63,.16);
  --accent:#7F8B6A; --accent-ink:#FFFFFF; --on-photo:#FFFFFF;
  --bar-bg:rgba(248,247,245,.86); --menu-bg:rgba(248,247,245,.97); --ph-bg:#D8D2C9; --hover:rgba(74,70,63,.06); --hover-2:rgba(255,255,255,.4); --note:#6A6A48; --cream:var(--bg); --shadow:0 1px 0 rgba(0,0,0,.03);
  --c-ing:#E6E0D6; --c-pet:#E8DFDA; --c-aqua:#DDE3DF; --c-bait:#E2E3D8; --c-mush:#E5DED7;
  --f:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-serif:"Instrument Serif",Georgia,serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --gut:max(clamp(16px,4vw,48px), calc((100vw - 1720px) / 2)); --r:6px; --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{--bg:#0B1322; --paper:#111C2F; --ink:#C9D2E0; --ink-strong:#F1F4F9; --muted:#8392A8; --faint:rgba(201,210,224,.2); --line:rgba(201,210,224,.13);
  --accent:#7FA6E0; --accent-ink:#0B1322; --bar-bg:rgba(13,22,39,.82); --menu-bg:rgba(13,22,39,.97); --ph-bg:#16233A; --hover:rgba(201,210,224,.07); --hover-2:rgba(255,255,255,.04); --note:#B7C79A;
  --c-ing:#0F1A2C; --c-pet:#0F1A2C; --c-aqua:#0F1A2C; --c-bait:#0F1A2C; --c-mush:#0F1A2C; color-scheme:dark;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1322; --paper:#111C2F; --ink:#C9D2E0; --ink-strong:#F1F4F9; --muted:#8392A8; --faint:rgba(201,210,224,.2); --line:rgba(201,210,224,.13);
  --accent:#7FA6E0; --accent-ink:#0B1322; --bar-bg:rgba(13,22,39,.82); --menu-bg:rgba(13,22,39,.97); --ph-bg:#16233A; --hover:rgba(201,210,224,.07); --hover-2:rgba(255,255,255,.04); --note:#B7C79A;
  --c-ing:#0F1A2C; --c-pet:#0F1A2C; --c-aqua:#0F1A2C; --c-bait:#0F1A2C; --c-mush:#0F1A2C; color-scheme:dark;}}
:root[data-lang="hu"] .en, :root[data-lang="en"] .hu{display:none !important}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:400 1rem/1.65 var(--f); -webkit-font-smoothing:antialiased; overflow-x:hidden}
a{color:inherit}
p{margin:0; max-width:60ch}
h1,h2,h3{margin:0; font-family:var(--f); font-weight:400; letter-spacing:-.035em; line-height:1.02; color:var(--ink-strong); text-wrap:balance; overflow-wrap:break-word}
h1{font-size:clamp(2.8rem,7vw,6.4rem); font-weight:300}
h2{font-size:clamp(2rem,4.2vw,3.6rem); font-weight:300}
h3{font-size:clamp(1.3rem,2vw,1.75rem); letter-spacing:-.02em; line-height:1.15}
.ser{font-family:var(--f-serif); font-style:italic; font-weight:400; letter-spacing:-.01em}
.sub{font:300 clamp(1.1rem,1.6vw,1.35rem)/1.4 var(--f); color:var(--muted); letter-spacing:-.01em}
.label{font:500 .72rem/1.3 var(--f); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); overflow-wrap:anywhere}
.muted{color:var(--muted)}
.pad{padding-inline:var(--gut)}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}

/* progress + header (floating bar, Planet-style) */
.progress{position:fixed; top:0; left:0; right:0; height:2px; background:var(--accent); transform-origin:0 50%; transform:scaleX(0); z-index:60}
header.site{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:var(--gut); right:var(--gut); z-index:50; transition:transform .7s var(--ease)}
header.site.hide{transform:translateY(-140%)}
.bar{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:20px; min-height:60px; padding-inline:18px !important; background:var(--bar-bg); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:14px; box-shadow:var(--shadow)}
.logo{grid-column:1; grid-row:1; display:flex; align-items:center; min-height:44px; text-decoration:none; font:600 1.3rem/1 var(--f); letter-spacing:-.03em; color:var(--ink-strong); white-space:nowrap}
.logo .ser{font:300 1.3rem/1 var(--f); font-style:normal; letter-spacing:-.03em; margin-left:.25em; color:var(--ink)}
nav.main{grid-column:2; grid-row:1; display:flex; flex-wrap:nowrap; justify-content:center; min-width:0}
nav.main a{display:flex; align-items:center; min-height:44px; padding:0 11px; white-space:nowrap; text-decoration:none; font:500 .88rem var(--f); letter-spacing:-.005em; color:var(--ink); border-radius:8px; transition:color .3s, background .3s}
nav.main a:hover{background:var(--hover)}
nav.main a[aria-current="page"]{color:var(--accent)}
.lang{grid-column:3; grid-row:1; justify-self:end; display:flex}
.lang button{min-height:44px; min-width:44px; border:0; background:transparent; color:var(--muted); font:500 .72rem var(--f); letter-spacing:.12em; cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ink-strong); text-decoration:underline; text-underline-offset:5px}
.hdr-tools{grid-column:3; grid-row:1; justify-self:end; display:flex; align-items:center; gap:4px}
@media (max-width:1040px){.bar{grid-template-columns:auto minmax(0,1fr) auto auto} .bar .menu-btn{grid-column:4; margin-right:0} .bar .hdr-tools{grid-column:3}}
.ldd{position:relative}
.ldd-btn,.theme-btn{display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px; min-width:44px; padding:0 10px; border:0; border-radius:10px; background:transparent; color:var(--ink-strong); font:500 .74rem var(--f); letter-spacing:.12em; cursor:pointer}
.ldd-btn:hover,.theme-btn:hover{background:var(--hover)}
.ldd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.ldd-list{position:absolute; right:0; top:calc(100% + 8px); min-width:170px; list-style:none; margin:0; padding:6px; background:var(--menu-bg); backdrop-filter:blur(14px); border-radius:12px; box-shadow:0 12px 32px -12px rgba(0,0,0,.3); z-index:70}
.ldd-list li{display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:44px; padding:0 12px; border-radius:8px; cursor:pointer; font-size:.92rem; color:var(--ink)}
.ldd-list li:hover,.ldd-list li:focus{background:var(--hover); outline:none}
.ldd-list li[aria-selected="true"]{color:var(--accent)}
.ldd-list li small{font:500 .7rem var(--f); letter-spacing:.12em; color:var(--muted)}
.tdd{position:relative}
.tdd-list{min-width:210px}
.tdd-list li{white-space:nowrap}
.theme-btn svg{display:none}
:root[data-tmode="light"] .theme-btn .i-sun,:root[data-tmode="dark"] .theme-btn .i-moon,:root[data-tmode="auto"] .theme-btn .i-auto{display:block}
.menu-btn{display:none; grid-column:3; margin-right:4px; grid-row:1; justify-self:end; min-height:44px; padding:0 14px; border:0; border-radius:10px; background:var(--ink); color:var(--paper); font:500 .72rem var(--f); letter-spacing:.12em; text-transform:uppercase; cursor:pointer}
.mobile-nav{display:none}
.navdrop{display:flex; align-items:center; gap:8px; min-height:44px; padding:0 8px; border:0; background:transparent; color:var(--ink); font:500 .72rem var(--f); letter-spacing:.12em; text-transform:uppercase; cursor:pointer}
.navdrop[aria-expanded="true"] svg{transform:rotate(180deg)}
@media (max-width:1040px){ nav.main{display:none} .menu-btn{display:block} }
@media all{
  .mobile-nav:not([hidden]){display:grid; margin-top:8px; padding:8px 18px 14px !important; background:var(--paper); border-radius:14px; box-shadow:0 18px 40px -16px rgba(0,0,0,.35)}
  .mobile-nav a{display:flex; justify-content:space-between; align-items:center; min-height:52px; text-decoration:none; border-bottom:1px solid var(--line); font:300 1.4rem var(--f); letter-spacing:-.02em}
}
@media (max-width:520px){ .logo, .logo .ser{font-size:1.1rem} .bar{padding-inline:10px !important} }

/* buttons */
.btns{display:flex; flex-wrap:wrap; gap:10px}
.btn{display:inline-flex; align-items:center; gap:12px; min-height:50px; padding:0 22px; border-radius:10px; text-decoration:none; font:500 .74rem var(--f); letter-spacing:.12em; text-transform:uppercase; background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent); transition:background .4s, color .4s, border-color .4s}
.btn:hover{background:var(--ink-strong); border-color:var(--ink-strong)}
.btn svg{transition:transform .5s var(--ease)} .btn:hover svg{transform:translateX(4px)}
.btn.ghost{background:transparent; color:var(--on-photo); border-color:rgba(255,255,255,.5)}
.btn.ghost:hover{background:var(--on-photo); color:var(--ink-strong); border-color:var(--on-photo)}

/* photos */
.ph{position:relative; overflow:hidden; background:var(--ph-bg); border-radius:var(--r)}
.ph canvas,.ph img,.ph video{position:absolute; left:0; top:-8%; width:100%; height:116%; object-fit:cover; display:block; transition:transform 1.6s var(--ease), filter .8s}
.ph .cap{position:absolute; right:10px; bottom:10px; z-index:3; padding:4px 8px; border-radius:4px; font:400 .62rem var(--f-mono); color:#fff; background:rgba(0,0,0,.35); max-width:calc(100% - 20px)}
.shade::after{content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,rgba(20,18,15,.25) 0%,rgba(20,18,15,0) 30%,rgba(20,18,15,.1) 60%,rgba(20,18,15,.6) 100%)}
.shade h1,.shade h2,.shade h3{color:var(--on-photo)}
.shade .label,.shade .sub{color:rgba(255,255,255,.82)}

/* hero */
.hero{margin:8px; min-height:calc(100vh - 16px); min-height:max(620px,calc(100svh - 16px)); display:flex; align-items:flex-end; color:var(--on-photo); border-radius:18px}
.hero .in{will-change:filter,opacity,transform; position:relative; z-index:2; width:100%; display:grid; gap:24px; padding-block:130px 40px}
.hero .in > *{min-width:0}
.hero h1 .ln{display:block; overflow:hidden; padding-bottom:.06em}
.hero h1 .ln > span{display:inline-block; animation:up 1.4s var(--ease) both}
.hero h1 .ln:nth-child(2) > span{animation-delay:.1s} .hero h1 .ln:nth-child(3) > span{animation-delay:.2s}
@keyframes up{from{transform:translateY(105%)}}
.hero .row{display:flex; justify-content:space-between; align-items:end; gap:24px; flex-wrap:wrap; border-top:1px solid rgba(255,255,255,.3); padding-top:22px}
.hero .lead{max-width:44ch; color:rgba(255,255,255,.88); font-weight:300; font-size:1.05rem}
.fade-in{animation:fi 1.3s .45s var(--ease) both} @keyframes fi{from{opacity:0; transform:translateY(14px)}}
.chips{display:flex; flex-wrap:wrap; gap:6px; list-style:none; margin:0; padding:0}
.chips li{min-height:30px; display:flex; align-items:center; padding:0 12px; border-radius:999px; border:1px solid rgba(255,255,255,.4); font:500 .66rem var(--f); letter-spacing:.12em; text-transform:uppercase}

/* info row */
.info{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; padding-block:12px}
.info > div{padding:28px 24px 28px 0; display:grid; gap:6px; align-content:start}
.info > div + div{border-left:1px solid var(--line); padding-left:24px}
.info b{font:300 clamp(1.4rem,2.2vw,1.9rem)/1.1 var(--f); letter-spacing:-.03em; color:var(--ink-strong)}
.info > div > span{color:var(--muted); font-size:.9rem}
@media (max-width:420px){.info > div{padding-right:12px} .info > div + div{padding-left:14px} .info b{font-size:1.2rem}}
@media (max-width:860px){.info{grid-template-columns:1fr 1fr} .info > div:nth-child(3){border-left:0; padding-left:0} .info > div:nth-child(n+3){border-top:1px solid var(--line)}}

/* marquee — light, quiet */
.marquee{overflow:hidden; padding-block:22px; border-block:1px solid var(--line)}
.marquee .track{display:flex; gap:56px; width:max-content; animation:mq 60s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}

/* bands */
.band{position:relative; padding-block:clamp(80px,11vw,160px)}
.band.cream{background:var(--bg)}
.wave{display:none}
.statement{font:400 clamp(1.5rem,3vw,2.6rem)/1.22 var(--f); letter-spacing:-.025em; color:var(--ink); max-width:30ch; text-wrap:pretty}
.statement .ser{font-size:1.06em}
[data-fill] .w{color:var(--faint); transition:color .4s}
[data-fill] .w.on{color:var(--ink)}
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2.2fr); gap:clamp(24px,5vw,80px)}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.center{display:grid; justify-items:center; text-align:center; gap:26px}
.center p{margin-inline:auto}

/* division rows */
.drows{border-top:1px solid var(--line)}
.drow{position:relative; display:block; text-decoration:none; border-bottom:1px solid var(--line); overflow:hidden}
.drow .ph{position:absolute; inset:6px; opacity:0; transition:opacity .8s var(--ease); border-radius:10px}
.drow .ph :is(canvas,img){transform:scale(1.1)}
.drow .ph::after{content:""; position:absolute; inset:0; background:rgba(20,18,15,.35)}
.drow .in{position:relative; z-index:2; display:grid; grid-template-columns:110px minmax(0,1.3fr) minmax(0,1fr) 48px; gap:24px; align-items:center; padding-block:30px; transition:padding .9s var(--ease)}
.drow .in > *{min-width:0}
.drow .no{font:500 .7rem var(--f); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); transition:color .5s}
.drow h3{font-size:clamp(1.8rem,3.6vw,3.2rem); font-weight:300; letter-spacing:-.035em; line-height:1.05; transition:transform .9s var(--ease), color .5s}
.drow p{color:var(--muted); font-size:.95rem; transition:color .5s}
.drow .go{width:48px; height:48px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; transition:background .5s, color .5s, border-color .5s}
.drow:hover .ph{opacity:1}
.drow:hover .ph :is(canvas,img){transform:scale(1)}
.drow:hover .in{padding-block:clamp(64px,8vw,110px)}
.drow:hover h3{transform:translateX(10px); color:#fff}
.drow:hover p, .drow:hover .no{color:rgba(255,255,255,.88)}
.drow:hover .go{background:#fff; color:var(--ink-strong); border-color:#fff}
@media (max-width:860px){ .drow .in{grid-template-columns:minmax(0,1fr) 48px; gap:10px 16px; padding-block:26px} .drow .no{grid-column:1 / -1} .drow p{grid-column:1} .drow .go{grid-column:2; grid-row:2} }

/* bleed photo */
.bleed{margin:8px; min-height:clamp(420px,78vh,800px); display:flex; align-items:flex-end; border-radius:18px}
.bleed .in{position:relative; z-index:2; padding-block:44px; width:100%}
.bleed .q{font:300 clamp(1.8rem,4vw,3.4rem)/1.12 var(--f); letter-spacing:-.03em; color:#fff; max-width:22ch}

/* numbered list */
.prog{list-style:none; margin:0; padding:0; counter-reset:n; border-top:1px solid var(--line)}
.prog li{counter-increment:n; display:grid; grid-template-columns:minmax(0,110px) minmax(0,1fr); gap:24px; padding-block:26px; border-bottom:1px solid var(--line)}
.prog li::before{content:"0" counter(n); font:300 clamp(1.6rem,3vw,2.4rem)/1 var(--f); letter-spacing:-.03em; color:var(--accent)}
.prog b{display:block; font:400 clamp(1.2rem,1.8vw,1.5rem)/1.2 var(--f); letter-spacing:-.02em; color:var(--ink-strong); margin-bottom:6px}
.prog span{color:var(--muted)}
@media (max-width:620px){.prog li{grid-template-columns:1fr; gap:8px}}

/* division blocks */
.block{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2.2fr); gap:clamp(24px,5vw,80px)}
.block .side{display:grid; gap:16px; align-content:start}
.block .body{display:grid; gap:28px; min-width:0}
@media (max-width:860px){.block{grid-template-columns:1fr}}
.rows{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.rows li{display:grid; grid-template-columns:minmax(0,250px) minmax(0,1fr); gap:20px; padding-block:20px; border-bottom:1px solid var(--line); transition:padding .7s var(--ease)}
.rows li:hover{padding-left:10px}
.rows strong{font:400 1.12rem/1.3 var(--f); letter-spacing:-.015em; color:var(--ink-strong)}
.rows span{color:var(--muted)}
@media (max-width:620px){.rows li{grid-template-columns:1fr; gap:4px}}
.tbl{overflow-x:auto; border-top:1px solid var(--line)}
table{width:100%; border-collapse:collapse; min-width:540px}
th,td{text-align:left; padding:15px 14px 15px 0; border-bottom:1px solid var(--line); vertical-align:top}
th{font:500 .68rem var(--f); letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
td:first-child{color:var(--ink-strong)}
td .lat{display:block; margin-top:2px; font:italic 400 .98rem var(--f-serif); color:var(--muted)}
.gal{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.gal .ph{aspect-ratio:3/4}
.gal .ph :is(canvas,img){filter:saturate(.55)}
.gal .ph:hover :is(canvas,img){filter:none; transform:scale(1.05)}
@media (max-width:620px){.gal{grid-template-columns:1fr 1fr} .gal .ph:first-child{grid-column:1 / -1; aspect-ratio:16/10}}
.species{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.species .ph{aspect-ratio:4/5}
.species .ph:hover :is(canvas,img){transform:scale(1.04)}
.species .txt{padding-top:18px; display:grid; gap:4px}
.species .lat{font:italic 400 1.15rem var(--f-serif); color:var(--muted)}
@media (max-width:720px){.species{grid-template-columns:1fr}}
.note{border-left:1px solid var(--accent); padding:8px 0 8px 14px; font:400 .8rem/1.55 var(--f-mono); color:var(--note)}
i.fill{font-style:normal; font-family:var(--f-mono); font-size:.82em; color:var(--note); border-bottom:1px dashed currentColor}

/* next + cta */
.next{margin:8px; min-height:clamp(340px,60vh,600px); display:flex; align-items:flex-end; text-decoration:none; border-radius:18px}
.next .in{position:relative; z-index:2; width:100%; padding-block:40px; display:flex; justify-content:space-between; align-items:end; gap:20px; flex-wrap:wrap}
.next .in > *{min-width:0}
.next h2{font-size:clamp(2.6rem,7vw,6rem); transition:transform 1s var(--ease)}
.next:hover h2{transform:translateX(12px)}
.next:hover :is(canvas,img){transform:scale(1.04)}
.cta{padding-block:clamp(90px,12vw,170px)}
.cta h2{font-size:clamp(3rem,9vw,8rem); font-weight:300}
.cta .row{display:flex; justify-content:space-between; gap:24px; align-items:end; flex-wrap:wrap; margin-top:28px}

/* contact */
.clist{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.clist li{display:grid; grid-template-columns:90px minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:center; padding-block:22px; border-bottom:1px solid var(--line)}
.clist .no{font:500 .7rem var(--f); letter-spacing:.14em; color:var(--muted)}
.clist h3{font-weight:300; font-size:clamp(1.5rem,2.6vw,2.2rem)}
@media (max-width:720px){.clist li{grid-template-columns:1fr; gap:4px}}
.copy{display:flex; flex-wrap:wrap; gap:14px; align-items:center}
.copy code{font:300 clamp(1.6rem,4.5vw,3.6rem)/1.1 var(--f); letter-spacing:-.03em; color:var(--ink-strong); user-select:all; word-break:break-all}
.copy button{min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font:500 .72rem var(--f); letter-spacing:.12em; text-transform:uppercase; cursor:pointer}


.rows .lat{display:block; margin-top:2px; font:italic 400 .98rem var(--f-serif); color:var(--muted)}
.hero video{z-index:0}
/* ---- interactive content blocks ---- */
.lead-p{font:300 clamp(1.25rem,2vw,1.7rem)/1.4 var(--f); letter-spacing:-.02em; color:var(--ink); max-width:44ch}
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--line)}
.stat{display:grid; gap:4px; padding:22px 16px 22px 0; align-content:start}
.stat + .stat{border-left:1px solid var(--line); padding-left:18px}
.stat b{font:300 clamp(2.2rem,4.4vw,3.8rem)/1 var(--f); letter-spacing:-.04em; color:var(--ink-strong); font-variant-numeric:tabular-nums}
.stat .suf{font:400 .95rem var(--f); color:var(--accent); min-height:1.2em}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr} .stat:nth-child(3){border-left:0; padding-left:0} .stat:nth-child(n+3){border-top:1px solid var(--line)}}
.sticky-wrap{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(20px,3vw,48px)}
.st-list{list-style:none; margin:0; padding:0}
.st-item{min-height:min(52vh,560px); display:grid; align-content:center; gap:10px; padding-block:24px; border-top:1px solid var(--line); opacity:.3; transition:opacity .5s var(--ease)}
.st-item.on{opacity:1}
.st-no{font:400 .8rem var(--f-mono); color:var(--accent)}
.st-media{position:relative}
.st-frame{position:sticky; top:110px; aspect-ratio:4/5; border-radius:10px; overflow:hidden; background:var(--ph-bg)}
.st-frame img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(1.06); transition:opacity .9s var(--ease), transform 1.4s var(--ease)}
.st-frame img.on{opacity:1; transform:none}
.st-mob{display:none}
@media (max-width:860px){ .sticky-wrap{grid-template-columns:1fr} .st-media{display:none} .st-item{min-height:0; opacity:1} .st-mob{display:block; aspect-ratio:16/10; margin-top:10px} }
.hv{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:clamp(20px,3vw,48px); align-items:start}
.hv-list{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.hv-list li{display:grid; grid-template-columns:minmax(0,1fr) 30px; gap:14px; align-items:center; min-height:44px; padding:18px 6px; border-bottom:1px solid var(--line); cursor:default; outline-offset:-2px; transition:padding .6s var(--ease), background .4s}
.hv-list li p{max-height:0; overflow:hidden; opacity:0; transition:max-height .6s var(--ease), opacity .5s, margin .5s}
.hv-list li.on{padding-left:14px; background:var(--hover-2)}
.hv-list li.on p{max-height:9em; opacity:1; margin-top:6px}
.hv-list h3{font-weight:300}
.hv-arr{color:var(--muted); transition:transform .5s var(--ease), color .3s}
.hv-list li.on .hv-arr{transform:translateX(4px); color:var(--accent)}
.hv-media{position:sticky; top:110px; aspect-ratio:4/5; border-radius:10px; overflow:hidden; background:var(--ph-bg)}
.hv-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(1.05); transition:opacity .7s var(--ease), transform 1.2s var(--ease)}
.hv-media img.on{opacity:1; transform:none}
@media (max-width:860px){ .hv{grid-template-columns:1fr} .hv-media{position:relative; top:0; aspect-ratio:16/10; order:-1} }
.tab-bar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.tab-bar button{min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); font:500 .88rem var(--f); cursor:pointer; transition:background .3s, color .3s}
.tab-bar button[aria-selected="true"]{background:var(--ink-strong); color:var(--paper); border-color:var(--ink-strong)}
.pills-l{display:flex; flex-wrap:wrap; gap:8px; list-style:none; margin:0; padding:0}
.pills-l li{padding:10px 14px; border-radius:10px; background:var(--paper); font-size:.95rem; animation:fi .6s var(--ease) both}
.pills-l li:nth-child(n){animation-delay:calc(var(--k,0) * 1ms)}
.cards2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.card2{background:var(--paper); border-radius:10px; overflow:hidden; display:grid; align-content:start}
.card2 .card-ph{aspect-ratio:16/10; border-radius:0}
.card2 .card-ph img{transition:transform 1.4s var(--ease)}
.card2:hover .card-ph img{transform:scale(1.05)}
.card2 .in{padding:22px; display:grid; gap:8px}
.card2 .lat{font:italic 400 1.05rem var(--f-serif); color:var(--muted)}
@media (max-width:720px){.cards2{grid-template-columns:1fr}}
.checks,.checks-s{list-style:none; margin:0; padding:0; display:grid; gap:0}
.checks{grid-template-columns:1fr 1fr; column-gap:28px; border-top:1px solid var(--line)}
.checks li,.checks-s li{position:relative; padding:14px 0 14px 30px; border-bottom:1px solid var(--line)}
.checks-s li{padding:6px 0 6px 24px; border:0; font-size:.93rem}
.checks li::before,.checks-s li::before{content:""; position:absolute; left:2px; top:1.25em; width:12px; height:7px; border-left:1.5px solid var(--accent); border-bottom:1.5px solid var(--accent); transform:translateY(-60%) rotate(-45deg)}
.checks-s li::before{top:.95em}
@media (max-width:620px){.checks{grid-template-columns:1fr}}
.hs-wrap{display:grid; gap:14px; min-width:0}
.hs{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(240px,32%); gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:8px; scrollbar-width:thin}
.hs-card{scroll-snap-align:start; display:grid; gap:8px; align-content:start}
.hs-card .hs-ph{aspect-ratio:3/4; border-radius:10px}
.hs-card .hs-ph img{transition:transform 1.4s var(--ease)}
.hs-card:hover .hs-ph img{transform:scale(1.06)}
.hs-card h3{margin-top:6px; font-weight:400}
.hs-nav{display:flex; gap:8px; justify-content:flex-end}
.hs-btn{width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ink); font-size:1.1rem; cursor:pointer; transition:background .3s, color .3s}
.hs-btn:hover{background:var(--ink-strong); color:var(--paper)}
@media (max-width:620px){.hs{grid-auto-columns:78%}}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none; display:flex; justify-content:space-between; align-items:center; gap:16px; min-height:60px; cursor:pointer; font:400 clamp(1.1rem,1.6vw,1.35rem) var(--f); letter-spacing:-.015em; color:var(--ink-strong)}
.acc summary::-webkit-details-marker{display:none}
.acc summary i{position:relative; width:14px; height:14px; flex:none}
.acc summary i::before,.acc summary i::after{content:""; position:absolute; left:0; right:0; top:50%; height:1.5px; background:var(--accent); transition:transform .4s var(--ease)}
.acc summary i::after{transform:rotate(90deg)}
.acc details[open] summary i::after{transform:rotate(0)}
.acc details p{padding:0 0 20px; max-width:60ch}
.cta-in{display:flex; justify-content:space-between; align-items:end; gap:20px; flex-wrap:wrap; padding-top:10px}
.story{position:relative; height:230vh}
.story-in{position:sticky; top:0; height:100vh; height:100svh; margin:0 8px; border-radius:18px; display:grid; place-items:center; overflow:hidden}
.story-in > img{top:0; height:100%}
.story-text{position:relative; z-index:2; display:grid; justify-items:center; gap:26px; text-align:center; max-width:1000px; will-change:filter,opacity,transform}
.story-text .label{color:rgba(255,255,255,.8)}
.story .statement{color:#fff; max-width:30ch; margin-inline:auto; font-size:clamp(1.7rem,3.6vw,3.2rem)}
.story .statement .ser{color:#fff}
.story .story-fill .w{color:rgba(255,255,255,.28); transition:color .35s}
.story .story-fill .w.on{color:#fff}
.story .story-lead{color:rgba(255,255,255,.85); margin-inline:auto; font-size:clamp(1.05rem,1.5vw,1.3rem)}
.hero.shade::after,.next.shade::after{background:linear-gradient(180deg,rgba(10,12,16,.4) 0%,rgba(10,12,16,.08) 26%,rgba(10,12,16,.3) 52%,rgba(10,12,16,.84) 100%),linear-gradient(90deg,rgba(10,12,16,.35) 0%,rgba(10,12,16,0) 60%)}
.hero .lead,.hero .sub{text-shadow:0 1px 18px rgba(0,0,0,.35)}
.story .shade::after{background:linear-gradient(180deg,rgba(15,20,30,.35),rgba(15,20,30,.45))}
.xp-row{display:flex; gap:8px; height:clamp(460px,70vh,680px)}
.xp{position:relative; flex:1 1 0; min-width:0; border-radius:14px; overflow:hidden; cursor:pointer; background:var(--ph-bg); transition:flex-grow .9s var(--ease); outline-offset:3px}
.xp.on{flex-grow:2.6}
.xp img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.08); filter:saturate(.7) brightness(.85); transition:transform 1.4s var(--ease), filter .8s}
.xp.on img{transform:scale(1); filter:none}
.xp::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(12,16,24,.05) 30%,rgba(12,16,24,.78) 100%)}
.xp-in{position:absolute; left:0; right:0; bottom:0; z-index:2; padding:clamp(18px,2.4vw,32px); color:#fff; display:grid; gap:10px}
.xp-no{font:400 .8rem var(--f-mono); color:rgba(255,255,255,.7)}
.xp h3{color:#fff; font-weight:300; font-size:clamp(1.3rem,2.2vw,2rem)}
.xp-body{display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .8s var(--ease), opacity .6s}
.xp-body > *{overflow:hidden}
.xp.on .xp-body{grid-template-rows:1fr; opacity:1; transition-delay:.15s}
.xp-body p{color:rgba(255,255,255,.88); max-width:48ch; font-size:.98rem}
.xp-body ul{display:flex; flex-wrap:wrap; gap:6px; list-style:none; margin:12px 0 0; padding:0}
.xp-go{margin-top:18px; justify-self:start}
.xp h3{white-space:nowrap}
.xp:not(.on) h3{writing-mode:vertical-rl; transform:rotate(180deg); font-size:clamp(1.3rem,2vw,1.8rem)}
.xp:not(.on) .xp-no{opacity:0; transition:opacity .4s}
.xp .xp-no{transition:opacity .6s .2s}
.xp-body li{padding:5px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.35); font:500 .68rem var(--f); letter-spacing:.1em; text-transform:uppercase}
@media (max-width:820px){ .xp-row{flex-direction:column; height:auto} .xp{flex:none; min-height:380px} .xp h3{white-space:normal} .xp:not(.on) .xp-no{opacity:1} .xp:not(.on) h3{writing-mode:horizontal-tb; transform:none} .xp .xp-body{grid-template-rows:1fr; opacity:1} .xp img{transform:none; filter:none} }
.pillars{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(12px,2vw,24px)}
.pl{position:relative; display:grid; gap:14px; align-content:start; padding:clamp(22px,2.4vw,34px) clamp(18px,2vw,28px) clamp(26px,3vw,40px); border-radius:14px; background:var(--paper); transition:transform .7s var(--ease), box-shadow .7s var(--ease)}
.pl::before{content:""; position:absolute; left:clamp(18px,2vw,28px); right:clamp(18px,2vw,28px); top:0; height:2px; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform 1.2s var(--ease) .2s}
.pl:not(.pre)::before{transform:scaleX(1)}
.pl:hover{transform:translateY(-6px); box-shadow:0 24px 48px -28px rgba(0,0,0,.35)}
.pl-ic{width:clamp(44px,4vw,56px); height:auto; color:var(--accent)}
.pl-ic *{stroke-dasharray:160; stroke-dashoffset:0; transition:stroke-dashoffset 1.8s var(--ease) .3s}
.pl.pre .pl-ic *{stroke-dashoffset:160}
.pl b{font:300 clamp(1.9rem,3.2vw,3rem)/1 var(--f); letter-spacing:-.04em; color:var(--ink-strong)}
.pl > span{color:var(--muted); font-size:1rem; line-height:1.45}
@media (max-width:960px){.pillars{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.pillars{grid-template-columns:1fr}}
.big-line{font:300 clamp(2rem,4.8vw,4.6rem)/1.12 var(--f); letter-spacing:-.04em; color:var(--ink-strong); max-width:27ch; margin:22px 0 0; text-wrap:pretty}
.ipill{display:inline-block; vertical-align:-.08em; width:1.7em; height:.82em; border-radius:999px; overflow:hidden; margin:0 .08em; background:var(--ph-bg); transform:scale(.55); opacity:.3; filter:grayscale(1); transform-origin:center; transition:transform .6s var(--ease), opacity .6s, filter .8s, box-shadow .6s}
.ipill.on{transform:scale(1); opacity:1; filter:none}
.ipill:hover{transform:scale(1.35); position:relative; z-index:2; box-shadow:0 6px 18px -6px rgba(0,0,0,.35)}
.ipill img{width:100%; height:100%; object-fit:cover; display:block}
@media (prefers-reduced-motion:reduce){.ipill{transform:none}}
.cform-wrap{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:clamp(28px,5vw,80px); align-items:start}
@media (max-width:900px){.cform-wrap{grid-template-columns:1fr}}
.cform{display:grid; gap:18px; background:var(--paper); border-radius:18px; padding:clamp(22px,3vw,40px)}
.f2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media (max-width:620px){.f2{grid-template-columns:1fr}}
.fld{display:grid; gap:8px; min-width:0; border:0; margin:0; padding:0}
.fld > span, .fld legend{font:500 .72rem var(--f); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:0}
.fld input:not([type=radio]),.fld textarea{width:100%; min-height:48px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink-strong); font:400 1rem var(--f); transition:border-color .3s, box-shadow .3s}
.fld textarea{resize:vertical; min-height:130px}
.fld input:not([type=radio]):focus,.fld textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 25%,transparent)}
.fld input::placeholder{color:var(--muted); opacity:.7}
.fld.bad input,.fld.bad textarea{border-color:#B5543F}
.chipsel > div{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.chipsel label{position:relative}
.chipsel input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.chipsel label > span{display:flex; align-items:center; min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-size:.93rem; transition:background .3s, color .3s, border-color .3s}
.chipsel input:checked + span{background:var(--ink-strong); color:var(--paper); border-color:var(--ink-strong)}
.chipsel input:focus-visible + span{outline:2px solid var(--accent); outline-offset:2px}
.chipsel.bad label > span{border-color:#B5543F}
.consent{display:grid; grid-template-columns:24px 1fr; gap:10px; align-items:start; font-size:.9rem; color:var(--muted); cursor:pointer; min-height:44px}
.consent input{width:20px; height:20px; margin-top:2px; accent-color:var(--accent)}
.consent.bad{color:#B5543F}
.f-actions{display:flex; flex-wrap:wrap; gap:16px; align-items:center}
.f-actions .btn{border:0; cursor:pointer}
.f-status{font-size:.92rem; color:var(--muted)}
.f-status.ok{color:var(--accent)}
.cinfo{display:grid; gap:8px; align-content:start; position:sticky; top:110px}
.cinfo .copy code{font-size:clamp(1.4rem,2.6vw,2.2rem)}
.big-c{font:300 clamp(1.4rem,2.6vw,2.2rem)/1.1 var(--f); letter-spacing:-.03em; color:var(--ink-strong)}
@media (max-width:900px){.cinfo{position:static}}
.logo .logo-svg{height:46px; width:auto; display:block; color:var(--ink-strong)}
@media (max-width:520px){.logo .logo-svg{height:38px}}
.hint-hover{}
@media (hover:none){.hint-hover{display:none}}
@media (max-width:400px){.logo .logo-svg{height:32px} .bar{gap:6px} .ldd-btn{padding:0 6px; gap:4px} .menu-btn{padding:0 10px; letter-spacing:.06em} .theme-btn{min-width:44px; padding:0}}
.need,.need-abs{display:grid; place-content:center; gap:6px; text-align:center; padding:16px; background:repeating-linear-gradient(135deg,var(--ph-bg) 0 14px,color-mix(in oklab,var(--ph-bg) 80%,var(--bg)) 14px 28px); border:1.5px dashed var(--accent); color:var(--ink-strong)}
.ph > .need{position:absolute; inset:0; border-radius:inherit}
.need span{font:500 .66rem var(--f); letter-spacing:.16em; color:var(--accent)}
.need b{font:400 clamp(.95rem,1.4vw,1.15rem)/1.3 var(--f)}
.need-abs{position:absolute; inset:0; opacity:0; transition:opacity .8s var(--ease)}
.need-abs.on{opacity:1}
.hv-media .need-abs,.st-frame .need-abs{border-radius:10px}
.mosaic{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:clamp(170px,19vw,260px); gap:10px}
.mo{margin:0; position:relative; border-radius:12px; overflow:hidden}
.mo:first-child{grid-row:span 2}
.mo .mo-ph{position:absolute; inset:0; border-radius:0}
.mo .mo-ph img{transition:transform 1.4s var(--ease)}
.mo:hover .mo-ph img{transform:scale(1.06)}
.mo figcaption{position:absolute; left:10px; bottom:10px; z-index:3; padding:5px 10px; border-radius:999px; background:rgba(12,14,18,.55); color:#fff; font:500 .7rem var(--f); letter-spacing:.08em; text-transform:uppercase; backdrop-filter:blur(6px)}
@media (max-width:720px){.mosaic{grid-template-columns:1fr 1fr} .mo:first-child{grid-column:1 / -1; grid-row:auto}}
.legal-body{max-width:820px; display:grid; gap:14px; margin-top:44px}
.legal-body h2{font-size:clamp(1.4rem,2.4vw,2rem); margin-top:26px}
.legal-body p{color:var(--ink); max-width:70ch}
.ldl{display:grid; margin:0; border-top:1px solid var(--line)}
.lrow{display:grid; grid-template-columns:minmax(0,220px) minmax(0,1fr); gap:16px; padding:14px 0; border-bottom:1px solid var(--line)}
.lrow dt{color:var(--muted); font-size:.92rem}
.lrow dd{margin:0; color:var(--ink-strong)}
@media (max-width:560px){.lrow{grid-template-columns:1fr; gap:4px}}
.consent a{color:var(--accent); text-underline-offset:3px; display:inline-block; padding-block:12px; margin-block:-12px}
/* footer */
:root{--foot:var(--paper); --foot-fg:var(--ink-strong); --foot-muted:var(--muted); --foot-line:var(--line)}
footer.site{position:relative; margin:clamp(40px,6vw,90px) 8px 8px; border-radius:18px; overflow:hidden; color:var(--foot-fg); background:var(--foot)}
.foot-land{position:relative; height:clamp(150px,20vw,300px); overflow:hidden; margin-top:-2px}
.foot-land img{position:absolute; left:0; top:0; width:100%; height:auto; min-height:170%; object-fit:cover; object-position:center top; filter:sepia(.75) saturate(.8) brightness(1.04); opacity:.5}
:root[data-theme="dark"] .foot-land img{filter:sepia(.75) saturate(.7) brightness(.6); opacity:.5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .foot-land img{filter:sepia(.75) saturate(.7) brightness(.6); opacity:.5}}
.foot-body{padding-top:clamp(40px,5vw,72px)}
.foot-top{display:flex; justify-content:space-between; align-items:end; gap:28px; flex-wrap:wrap; padding-bottom:clamp(36px,5vw,64px); border-bottom:1px solid var(--foot-line)}
.foot-logo{display:block; color:var(--ink-strong); min-height:44px}
.foot-logo .logo-svg{height:clamp(84px,11vw,150px); width:auto; display:block}
.foot-cta{display:grid; gap:18px; justify-items:start; max-width:460px}
.foot-claim{font:300 clamp(1.3rem,2.2vw,1.9rem)/1.2 var(--f); letter-spacing:-.02em; color:var(--foot-fg)}
.foot-btn{}

.foot-cols{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(24px,4vw,64px); padding-block:clamp(36px,5vw,64px)}
.foot-cols h4{margin:0 0 14px; font:500 .7rem var(--f); letter-spacing:.16em; text-transform:uppercase; color:var(--foot-muted)}
.foot-cols ul{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.foot-cols a{display:inline-flex; align-items:center; min-height:44px; text-decoration:none; font-size:1.02rem; color:var(--foot-fg); background:linear-gradient(currentColor,currentColor) 0 calc(100% - 10px)/0 1px no-repeat; transition:background-size .5s var(--ease)}
.foot-cols a:hover{background-size:100% 1px}
.foot-contact li{display:grid; gap:2px; padding:8px 0}
.foot-contact .fk{font-size:.8rem; color:var(--foot-muted)}
.foot-contact .fv{font-size:1.02rem; user-select:all}
.foot-bottom{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px 24px; padding-block:18px 8px; border-top:1px solid var(--foot-line); color:var(--foot-muted); font-size:.85rem}
.foot-bottom nav{display:flex; flex-wrap:wrap; gap:0 6px}
.foot-bottom nav a{display:inline-flex; align-items:center; min-height:44px; padding:0 8px; color:var(--foot-muted); text-decoration:none}
.foot-bottom nav a:hover{color:var(--foot-fg)}

 aqua:{no:'02',art:'hero-poster',brand:'Lanartis Aqua',
  tag:{hu:'Gyártás · Magyarország',en:'Manufacturing · Hungary'},
  t1:{hu:'Haltáp',en:'Aqua feed'}, t2:{hu:'süllyedő és úszó haltáp Magyarországról',en:'sinking and floating fish feed from Hungary'},
  lead:{hu:'Indítótól a befejező tápig, süllyedő és úszó változatban, tavi és intenzív (RAS) tartásra. Receptjeink a jó növekedést, a kedvező takarmányértékesítést és a tiszta vizet szolgálják. Gluténmentesek, GMO-mentesek, és nem tartalmaznak antibiotikumot vagy szóját.',en:'From starter to finisher, sinking and floating, for ponds and intensive RAS. Our recipes are built for strong growth, good feed conversion and clean water. They are gluten-free and GMO-free, with no antibiotics and no soy.'},
  card:{hu:'Haltáp afrikai harcsára, pontyra és minden Európában tenyésztett halfajra. Glutén-, GMO-, antibiotikum- és szójamentes.',en:'Fish feed for African catfish, carp and all species farmed in Europe. Free from gluten, GMOs, antibiotics and soy.'},

     {img:'harcsa',h:{hu:'Afrikai harcsa',en:'African catfish'},lat:'Clarias gariepinus',p:{hu:'Stabil úszó pellet Herbal Power gyógynövényes premixszel. Vízben stabil, minimális a kioldódás, intenzív RAS-rendszerekhez fejlesztettük. Indítótól a nevelőtápig, minden szakaszhoz igazított fehérjetartalommal.',en:'Stable floating pellets with our Herbal Power herbal premix. Water-stable with minimal leaching, developed for intensive RAS. From starter to grower, with protein levels matched to each stage.'},list:[{hu:'Újdonság: RAS-hoz fejlesztett stabil úszó pellet',en:'New: stable floating pellet developed for RAS'},{hu:'Természetes: Herbal Power premix az egészséges bélflóráért',en:'Natural: Herbal Power premix for gut health'}]},
     {img:'carp',h:{hu:'Ponty',en:'Common carp'},lat:'Cyprinus carpio',p:{hu:'Kukorica-alapú, jól emészthető receptek tavi haltermeléshez, ugyanazzal a Herbal Power premixszel. Az energia–fehérje arányt az évszakhoz és a népesítési sűrűséghez igazítjuk.',en:'Corn-based, highly digestible recipes for pond farming, with the same Herbal Power premix. The energy-to-protein ratio is adjusted to the season and stocking density.'},list:[{hu:'Újdonság: évszakhoz igazított energia–fehérje arány',en:'New: energy-to-protein ratio adjusted to the season'},{hu:'Természetes: hazai kukorica, könnyen emészthető',en:'Natural: Hungarian corn base, easy to digest'}]}]},
   {label:{hu:'Összetétel',en:'Composition'},h:{hu:'Mi nincs benne, és miért',en:'What we leave out, and why'},
    sticky:[
     {img:'ing-hero',h:{hu:'Kukorica-alapú',en:'Corn-based'},p:{hu:'A kukorica jól emészthető energiaforrás a melegvízi, mindenevő halaknak. Kiválóan extrudálható, és természetes xantofillokat tartalmaz, amelyeket a hal maga nem tud előállítani.',en:'Corn is a highly digestible source of energy for warm-water omnivorous fish. It extrudes well and provides natural xanthophylls that fish cannot produce themselves.'}},
     {img:'meal',h:{hu:'Glutén- és szójamentes',en:'Gluten- and soy-free'},p:{hu:'Búzát nem használunk, ezért a táp gluténmentes. A szója antinutritív anyagai és fitoösztrogénjei megterhelik a hal emésztését, ezért kihagyjuk.',en:'We don’t use wheat, so the feed is gluten-free. Soy’s anti-nutritional factors and phytoestrogens put a strain on digestion, so we leave it out.'}},
     {img:'home-hero',h:{hu:'GMO-mentes, hazai alapanyag',en:'GMO-free, Hungarian raw materials'},p:{hu:'A haltápok legnagyobb GMO-kockázata az importszója. Mi kihagyjuk, így a GMO-mentes termelésre törekvő gazdaságok is nyugodtan választhatnak minket.',en:'Imported soy is the biggest GMO risk in fish feed. We leave it out, so farms working towards GMO-free production can rely on us.'}},
     {img:'carp',h:{hu:'Antibiotikum-mentes szemlélet',en:'Antibiotic-free approach'},p:{hu:'Az egészséges hal alapja a jó takarmány és a megfelelő tartás, nem a rutinszerű gyógyszerezés. Receptjeinkben nincs hozamfokozó antibiotikum és rutinszerű gyógyszeres adalék.',en:'Healthy fish start with good feed and good husbandry, not routine medication. Our recipes contain no growth-promoting antibiotics and no routine medicated additives.'}},
     {img:'haltap-pellet',h:{hu:'Herbal Power premix',en:'Herbal Power premix'},p:{hu:'Ahol mások vegyszert használnak, mi gyógynövényeket. Saját fejlesztésű premix, gondosan válogatott természetes összetevőkből.',en:'Where others use chemicals, we use herbs. An in-house premix made from carefully selected natural ingredients.'}}]},

     {img:'ras-telep',h:{hu:'Egyéb európai fajok',en:'Other European species'},p:{hu:'Pisztráng, tokhal, süllő, európai harcsa és tilapia. A fehérjetartalmat, a pelletméretet és a premixet fajra szabva, a teleppel közösen alakítjuk ki.',en:'Trout, sturgeon, pikeperch, wels catfish and tilapia. We set protein levels, pellet sizes and premixes for each species, together with the farm.'}},
     {img:'garnela',h:{hu:'Garnéla és rák',en:'Shrimp & crayfish'},p:{hu:'Rákféléknek, RAS-rendszerekhez és tavakhoz: vízálló, süllyedő pellet a vedléshez szükséges ásványianyag-egyensúllyal.',en:'For crustaceans in RAS and ponds: water-stable sinking pellets with the mineral balance needed for moulting.'}},

function division(id){
  const d=D[id], col=COL[id];
  let alt=0;
  const blocks=d.blocks.map(b=>{
    const cream=(alt++%2===1);
    let body='';
    if(b.plband) body+=`<div class="plband rv"><ol>${b.plband.steps.map((x,i)=>`<li><span>0${i+1}</span><b>${L(x)}</b></li>`).join('')}</ol><p>${L(b.plband.p)}</p></div>`;
    if(b.lead) body+=`<p class="lead-p rv">${L(b.lead)}</p>`;
    if(b.nn) body+=`<ul class="nn rv"><li><em>${L({hu:'Új',en:'New'})}</em>${L(b.nn[0])}</li><li><em>${L({hu:'Természetes',en:'Natural'})}</em>${L(b.nn[1])}</li></ul>`;
    if(b.pills) body+=`<ul class="spills rv">${b.pills.map(x=>`<li>${L(x)}</li>`).join('')}</ul>`;
    if(b.species) body+=`<div class="species">${b.species.map(s=>`<article class="rv">${ph(s[0],s[4])}<div class="txt"><h3>${L(s[1])}</h3><span class="lat">${s[2]}</span><p class="muted">${L(s[3])}</p></div></article>`).join('')}</div>`;
    if(b.table) body+=`<div class="tbl rv"><table><thead><tr>${b.table.head.map(h=>`<th>${L(h)}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${L(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(b.rows) body+=`<ul class="rows">${b.rows.map(r=>`<li class="rv"><strong>${L(r[0])}</strong><span>${L(r[1])}</span></li>`).join('')}</ul>`;
    if(b.steps) body+=`<ol class="prog">${b.steps.map(s=>`<li class="rv"><div><b>${L(s[0])}</b><span>${L(s[1])}</span></div></li>`).join('')}</ol>`;
    if(b.stats) body+=`<div class="stats">${b.stats.map(s=>`<div class="stat rv"><b data-count="${typeof s.n==='number'?s.n:''}">${typeof s.n==='number'?'0':s.n}</b><span class="suf">${s.suf?L(s.suf):''}</span><span class="muted">${L(s.l)}</span></div>`).join('')}</div>`;
    if(b.sticky) body+=`<div class="sticky-wrap"><ol class="st-list">${b.sticky.map((x,i)=>`<li class="st-item${i?'':' on'}" data-i="${i}"><span class="st-no">0${i+1}</span><h3>${L(x.h)}</h3><p class="muted">${L(x.p)}</p>${ph(x.img,'','st-mob')}</li>`).join('')}</ol><div class="st-media" aria-hidden="true"><div class="st-frame">${b.sticky.map((x,i)=>imgTag(x.img,i?'':'on',i)).join('')}</div></div></div>`;
    if(b.hover) body+=`<div class="hv"><ul class="hv-list">${b.hover.map((x,i)=>`<li tabindex="0" data-i="${i}" class="${i?'':'on'}"><div><h3>${L(x.h)}</h3><p class="muted">${L(x.p)}</p></div><span class="hv-arr">→</span></li>`).join('')}</ul><div class="hv-media" aria-hidden="true">${b.hover.map((x,i)=>imgTag(x.img,i?'':'on',i)).join('')}</div></div>`;
    if(b.tabs) body+=`<div class="tabs rv"><div class="tab-bar" role="tablist">${b.tabs.map((t,i)=>`<button type="button" role="tab" aria-selected="${!i}" data-i="${i}">${L(t.t)}</button>`).join('')}</div>${b.tabs.map((t,i)=>`<ul class="pills-l" data-i="${i}" ${i?'hidden':''}>${t.items.map(x=>`<li>${L(x)}</li>`).join('')}</ul>`).join('')}</div>`;
    if(b.cards) body+=`<div class="cards2">${b.cards.map(c=>`<article class="card2 rv">${ph(c.img,'','card-ph')}<div class="in"><h3>${L(c.h)}</h3>${c.lat?`<span class="lat">${c.lat}</span>`:''}<p class="muted">${L(c.p)}</p>${c.list?`<ul class="checks-s">${c.list.map(x=>`<li>${L(x)}</li>`).join('')}</ul>`:''}</div></article>`).join('')}</div>`;
    if(b.hs) body+=`<div class="hs-wrap"><div class="hs" tabindex="0">${b.hs.map(x=>`<article class="hs-card">${ph(x.img,'','hs-ph')}<h3>${L(x.h)}</h3><p class="muted">${L(x.p)}</p></article>`).join('')}</div><div class="hs-nav"><button type="button" class="hs-btn" data-d="-1" aria-label="Vissza">←</button><button type="button" class="hs-btn" data-d="1" aria-label="Tovább">→</button></div></div>`;
    if(b.mosaic) body+=`<div class="mosaic">${b.mosaic.map((x,i)=>`<figure class="mo rv" style="transition-delay:${(i%3)*.08}s">${ph(x.img,'','mo-ph')}<figcaption>${L(x.cap)}</figcaption></figure>`).join('')}</div>`;
    if(b.checks) body+=`<ul class="checks">${b.checks.map(x=>`<li class="rv">${L(x)}</li>`).join('')}</ul>`;
    if(b.gal) body+=`<div class="gal">${b.gal.slice(0,3).map(g=>ph(g[0],'','clip')).join('')}</div>`;
    if(b.text) body+=`<p class="statement rv txt-link" style="font-size:clamp(1.3rem,2.2vw,1.9rem)">${L(b.text)}</p>`;
    if(b.acc) body+=`<div class="acc">${b.acc.map(x=>`<details class="rv"><summary><span>${L(x.h)}</span><i aria-hidden="true"></i></summary><p class="muted">${L(x.p)}</p></details>`).join('')}</div>`;
    if(b.note) body+=`<p class="note rv">${L(b.note)}</p>`;
    if(b.cta) body+=`<div class="cta-in rv"><p class="statement" style="font-size:clamp(1.3rem,2.2vw,1.9rem)">${L(b.cta)}</p>${btn('#contact',{hu:'Ajánlatkérés',en:'Request a quote'})}</div>`;
    const bg=cream?'var(--cream)':col;
    return {bg, html:`<section class="band pad ${cream?'cream':''}" style="background:${bg}"><div class="block"><div class="side"><span class="label rv">${L(b.label)}</span><h2 class="rv" style="font-size:clamp(2.4rem,5vw,4.6rem)">${L(b.h)}</h2></div><div class="body">${body}</div></div></section>`};
  });
  let out='', prev=col;
  blocks.forEach((b,i)=>{ if(i>0) out+=wave(prev,b.bg); out+=b.html; prev=b.bg; });
  const n=ORDER[(ORDER.indexOf(id)+1)%ORDER.length], nd=D[n];
  return `
  <section class="ph hero shade" data-art="${d.art}" data-parallax>
    ${NEED(d.art)?needBox(d.art):IMG[d.art]?`<img src="${IMG[d.art]}" alt="${A(d.art)}" data-k="${d.art}" decoding="async">`:''}
    <div class="in pad">
      <span class="label fade-in">${d.brand} · ${L(d.tag)}</span>
      <h1 style="font-size:clamp(3.4rem,11vw,10.5rem)"><span class="ln"><span>${L(d.t1)}</span></span></h1>
      <div class="row fade-in"><div style="display:grid;gap:14px"><p class="sub">${L(d.t2)}</p><p class="lead">${L(d.lead)}</p><ul class="chips">${d.chips.map(c=>`<li>${L(c)}</li>`).join('')}</ul></div>
      ${btn('#contact',{hu:'Ajánlatkérés',en:'Request a quote'})}</div>
    </div>
  </section>
  <div class="pad sum-wrap" style="background:${col}"><p class="sum rv">${L(SUM[id])}</p></div>
  <div class="info pad" style="background:${col}">${d.tiles.map(t=>`<div class="rv"><b>${L(t[1])}</b><span>${L(t[2])}</span></div>`).join('')}</div>
  <div style="background:${col}">${out}</div>
  ${wave(prev,'var(--night)')}
  <a class="ph next shade" data-art="${nd.art}" href="#${n}">${NEED(nd.art)?needBox(nd.art):IMG[nd.art]?`<img src="${IMG[nd.art]}" alt="" loading="lazy">`:''}
    <div class="in pad"><div style="display:grid;gap:12px"><span class="label">${L({hu:'Következő terület',en:'Next division'})} · ${nd.no}</span><h2>${L(nd.t1)}</h2><span class="sub">${L(nd.t2)}</span></div><span class="btn">${L({hu:'Tovább',en:'View'})}${IC.arrow}</span></div>
  </a>
  ${cta()}`;
}

function paint(el){
  const art=el.dataset.art; if(IMG[art]&&!el.querySelector(':scope > img, :scope > video')){const im=document.createElement('img');im.src=IMG[art];im.alt='';im.decoding='async';el.prepend(im)} if(IMG[art]||el.querySelector('video')||!ART[art]) return;
  let cv=el.querySelector('canvas'); if(!cv){cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');el.prepend(cv)}
  const dpr=Math.min(window.devicePixelRatio||1,1.5);const w=Math.max(80,Math.round(el.clientWidth*dpr)),h=Math.max(80,Math.round(el.clientHeight*1.12*dpr));
  if(cv.width===w&&cv.height===h) return; cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');const R=rng(hash(art+(el.dataset.seed||'')));ART[art](ctx,w,h,R);grain(ctx,w,h,R,.06);
}



function initInteractive(){
  // sticky scrollytelling
  document.querySelectorAll('.sticky-wrap').forEach(w=>{
    const items=[...w.querySelectorAll('.st-item')], imgs=[...w.querySelectorAll('.st-frame img,.st-frame .need-abs')];
    const set=i=>{items.forEach(x=>x.classList.toggle('on',+x.dataset.i===i));imgs.forEach(x=>x.classList.toggle('on',+x.dataset.i===i))};
    const pick=()=>{if(!document.body.contains(w)){removeEventListener('scroll',pick);return}const fr=w.querySelector('.st-frame');const fb=fr&&fr.offsetParent?fr.getBoundingClientRect():null;const line=fb?fb.top+fb.height*.85:innerHeight*.6;let a=0;items.forEach((x,i)=>{const t=x.querySelector('h3').getBoundingClientRect().top;if(t<line)a=i});set(a)};
    addEventListener('scroll',pick,{passive:true});pick();
  });
  // hover list
  document.querySelectorAll('.hv').forEach(w=>{
    const li=[...w.querySelectorAll('.hv-list li')], im=[...w.querySelectorAll('.hv-media img,.hv-media .need-abs')];
    const set=i=>{li.forEach(x=>x.classList.toggle('on',+x.dataset.i===i));im.forEach(x=>x.classList.toggle('on',+x.dataset.i===i))};
    li.forEach(x=>{x.addEventListener('mouseenter',()=>set(+x.dataset.i));x.addEventListener('focus',()=>set(+x.dataset.i));x.addEventListener('click',()=>set(+x.dataset.i))});
  });
  // tabs
  document.querySelectorAll('.tabs').forEach(w=>{
    w.querySelectorAll('.tab-bar button').forEach(bt=>bt.addEventListener('click',()=>{
      w.querySelectorAll('.tab-bar button').forEach(x=>x.setAttribute('aria-selected',String(x===bt)));
      w.querySelectorAll('.pills-l').forEach(u=>u.hidden=u.dataset.i!==bt.dataset.i);
    }));
    w.querySelectorAll('.pills-l li').forEach((li,i)=>li.style.setProperty('--k',(i%20)*35));
  });
  // horizontal scroller
  document.querySelectorAll('.hs-wrap').forEach(w=>{const s=w.querySelector('.hs');w.querySelectorAll('.hs-btn').forEach(b=>b.addEventListener('click',()=>s.scrollBy({left:+b.dataset.d*s.clientWidth*.8,behavior:'smooth'})))});
  document.querySelectorAll('.xp-row').forEach(r=>{const xs=[...r.querySelectorAll('.xp')];const set=x=>xs.forEach(y=>y.classList.toggle('on',y===x));xs.forEach(x=>{x.addEventListener('mouseenter',()=>set(x));x.addEventListener('focus',()=>set(x));x.addEventListener('click',()=>set(x))})});
  // count-up
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-count]').forEach(el=>{const n=+el.dataset.count;if(!el.dataset.count)return;if(reduce){el.textContent=n;return}
    const o=new IntersectionObserver(es=>{if(!es[0].isIntersecting)return;o.disconnect();const t0=performance.now();const tick=t=>{const p=Math.min(1,(t-t0)/1400);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)});o.observe(el)});
}

  const cf=document.getElementById('cform');

    const need=[['f-name',v=>v.trim().length>1],['f-email',v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)],['f-msg',v=>v.trim().length>4]];
    need.forEach(([id,t])=>{const el=document.getElementById(id);const bad=!t(el.value);el.closest('.fld').classList.toggle('bad',bad);if(bad)ok=false});
    const dv=cf.querySelector('input[name=division]:checked');cf.querySelector('.chipsel').classList.toggle('bad',!dv);if(!dv)ok=false;
    const g=document.getElementById('f-gdpr');g.closest('.consent').classList.toggle('bad',!g.checked);if(!g.checked)ok=false;
    const hu=root.dataset.lang!=='en';
    if(!ok){st.className='f-status';st.textContent=hu?'Kérjük, töltse ki a csillaggal jelölt mezőket.':'Please fill in the fields marked with *.';return}
    st.className='f-status ok';st.textContent=hu?'Tervezési minta: élesítéskor ez az üzenet az info@lanartis.com címre megy.':'Design preview: once live, this message goes to info@lanartis.com.';});
  const cm=document.getElementById('copy-mail');
  if(cm) cm.addEventListener('click',()=>{const t=document.getElementById('mail');const sel=()=>{const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r)};navigator.clipboard?navigator.clipboard.writeText(t.textContent).catch(sel):sel()});
  onScroll();
}

const hdr=document.getElementById('hdr'),prog=document.getElementById('progress');
let lastY=0,ticking=false;
function onScroll(){
  const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
  hdr.classList.toggle('solid',y>40||!document.getElementById('mobile-nav').hidden);
  hdr.classList.toggle('hide',y>lastY&&y>300&&document.getElementById('mobile-nav').hidden);
  lastY=y;
  prog.style.transform=`scaleX(${max>0?y/max:0})`;
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.querySelectorAll('[data-parallax]').forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const cv=el.querySelector(':scope > video, :scope > img, :scope > canvas');if(cv)cv.style.transform=`translateY(${(r.top*-.12).toFixed(1)}px)`});
  }
  document.querySelectorAll('[data-fill]').forEach(el=>{const r=el.getBoundingClientRect();const p=Math.min(1,Math.max(0,(innerHeight*.9-r.top)/(r.height+innerHeight*.45)));const ws=[...el.querySelectorAll('.w')].filter(w=>w.offsetParent!==null);const k=Math.round(p*ws.length);ws.forEach((w,i)=>w.classList.toggle('on',i<k||matchMedia('(prefers-reduced-motion: reduce)').matches));el.querySelectorAll('.ipill').forEach(pl=>{const pv=pl.parentElement.style.whiteSpace==='nowrap'?pl.parentElement.previousElementSibling:pl.previousElementSibling;pl.classList.toggle('on',!pv||pv.classList.contains('on'))})});

  ticking=false;
}
